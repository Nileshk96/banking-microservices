server:
  port: 8082

spring:
  application:
    name: ACCOUNT-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5433/banking_db
    username: banking
    password: banking


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.jdbc.time_zone: UTC

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka