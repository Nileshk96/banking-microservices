server:
  port: 8081

spring:

  application:
    name: CUSTOMER-SERVICE



  datasource:
    url: jdbc:postgresql://localhost:5433/banking_db
    username: banking
    password: banking

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.jdbc.time_zone: UTC

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka